version: '3'

services:
  app:
    build: .
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`stem-builder-u70983.vm.elestio.app`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      SQLITE_PATH: /app/data/app.db
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret-in-production}
    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data:
